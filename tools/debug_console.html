<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Street Hustle | Dialogue Care</title>
    <style>
        /* ------------------------- */
        /* --- THEME & VARIABLES --- */
        /* ------------------------- */
        :root {
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            
            /* Colors from Screenshot */
            --color-bg: #000000;
            --color-surface: #1C1C1E;
            --color-text-header: #FFFFFF;
            --color-text-base: #F2F2F7;
            --color-text-muted: #8E8E93;
            --color-primary: #588DFF; /* A slightly more saturated blue for the button */
            --color-progress-blue: #58B1FF;
            --color-status-green-start: #29CF7F;
            --color-status-green-end: #22A39F;
            --color-status-yellow: #FFD60A;
            --color-status-red: #FF453A;

            /* Sizing & Spacing */
            --spacing-unit: 8px;
            --radius-card: 24px;
            --radius-btn: 28px;
        }

        /* -------------------- */
        /* --- BASE & LAYOUT -- */
        /* -------------------- */
        * { box-sizing: border-box; }

        html { font-size: 16px; }

        body {
            font-family: var(--font-ui);
            margin: 0;
            background-color: #333; /* Gutter color */
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .device-screen {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 926px;
            background-color: var(--color-bg);
            border-radius: 36px;
            box-shadow: 0 0 0 10px #111, 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            color: var(--color-text-header);
            flex-shrink: 0;
        }
        
        .app-header .left, .app-header .right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .app-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
        }
        
        .app-header svg {
            width: 24px;
            height: 24px;
        }

        .app-main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0.5rem 1rem 2rem 1rem;
        }
        /* Custom scrollbar for a more native feel */
        .app-main::-webkit-scrollbar { width: 4px; }
        .app-main::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .section-header {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-muted);
            padding: 1.5rem 0.5rem 0.5rem 0.5rem;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--color-surface);
            border-radius: var(--radius-card);
            padding: 1rem 1.5rem;
        }
        
        /* ---------------------- */
        /* --- STATUS SECTION --- */
        /* ---------------------- */
        .status-section {
            text-align: center;
            padding: 1.5rem 0;
        }
        
        .status-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(135deg, var(--color-status-green-start), var(--color-status-green-end));
            transition: background-image 0.3s ease;
        }
        .status-icon.warn {
             background-image: linear-gradient(135deg, var(--color-status-yellow), #FFB700);
        }
        .status-icon.error {
             background-image: linear-gradient(135deg, var(--color-status-red), #D62828);
        }
        .status-icon svg {
            width: 50px;
            height: 50px;
            color: white;
            transition: transform 0.3s ease; /* For icon changes */
        }

        .status-icon.scanning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-text {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 1rem;
            color: var(--color-text-header);
        }
        
        .status-subtext {
            font-size: 1rem;
            color: var(--color-text-muted);
            margin-top: 0.25rem;
        }
        
        .action-section {
            padding: 1rem 0;
        }

        #analyze-btn {
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            background-color: var(--color-primary);
            color: var(--color-text-header);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        #analyze-btn:active { transform: scale(0.98); }
        #analyze-btn[disabled] {
            background-color: #333;
            color: var(--color-text-muted);
            cursor: not-allowed;
        }
        
        /* ------------------------- */
        /* --- STATS & ISSUES LIST --- */
        /* ------------------------- */
        
        ul.list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .list-item {
            display: grid;
            grid-template-areas: "icon content" "icon progress";
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0 1rem;
            padding: 1rem 0;
        }
        
        .list-item:not(:last-child) {
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .item-icon {
            grid-area: icon;
            color: var(--color-text-muted);
        }
        .item-icon svg {
            width: 22px;
            height: 22px;
        }
        
        .item-content {
            grid-area: content;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        
        .item-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-base);
        }
        
        .item-value {
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--color-text-header);
        }
        .item-value-unit {
            font-size: 1rem;
            font-weight: 400;
            color: var(--color-text-muted);
            margin-left: 0.25rem;
        }
        
        .item-progress {
            grid-area: progress;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0;
            background-color: var(--color-progress-blue);
            border-radius: 3px;
            transition: width 0.4s ease-out;
        }
        .progress-fill.green { background-color: var(--color-status-green-start); }

        .progress-text {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }
        
        /* Issue Log Specifics */
        .issue-log { max-height: 250px; overflow-y: auto; }
        .issue-item {
             display: flex;
             align-items: flex-start;
             gap: 0.75rem;
             padding: 0.75rem 0.25rem;
        }
        .issue-icon {
            flex-shrink: 0;
            margin-top: 2px;
        }
        .issue-icon.warn { color: var(--color-status-yellow); }
        .issue-icon.error { color: var(--color-status-red); }
        .issue-icon svg { width: 18px; height: 18px; }
        
        .issue-message {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            line-height: 1.4;
        }
        .issue-message b { color: var(--color-text-base); }

        /* Filter styling */
        .list-item.stat-filterable { cursor: pointer; }
        .list-item.stat-filterable:hover { background-color: #2a2a2c; }
        .list-item.stat-filter-active {
            background-color: var(--color-primary) !important;
            color: white;
        }
        .list-item.stat-filter-active .item-label,
        .list-item.stat-filter-active .item-value,
        .list-item.stat-filter-active .item-value-unit,
        .list-item.stat-filter-active .progress-text,
        .list-item.stat-filter-active .item-icon {
            color: white !important;
        }
        .list-item.stat-filter-active .progress-fill { background-color: white !important; }

        /* Sparkle animation for excellent status */
        .status-icon.excellent-animation svg {
            animation: sparkleEffect 0.8s ease-in-out;
        }

        @keyframes sparkleEffect {
            0%, 100% { transform: scale(1); opacity: 1; }
            25% { transform: scale(1.1) rotate(-5deg); opacity: 0.8; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: brightness(1.5); }
            75% { transform: scale(1.1) rotate(-2deg); opacity: 0.8; }
        }

    </style>
</head>

<body>
    <div class="device-screen">
        <header class="app-header">
            <div class="left">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
                <h1>Dialogue care</h1>
            </div>
            <div class="right">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" /></svg>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h1.5v15H3m16.5 0h-1.5v-15H21M12 21V3" /></svg> <!-- Placeholder, consider removing or making functional -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM10 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM11.5 15.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" /></svg>
            </div>
        </header>

        <main class="app-main">
            <section class="status-section">
                <div id="status-icon" class.bind="statusIconClass" class="status-icon">
                    <!-- Default Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon-default">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9 9.75h.008v.008H9v-.008Zm6 0h.008v.008H15v-.008Z" />
                    </svg>
                </div>
                <h2 id="status-text" class="status-text">Ready to Scan</h2>
                <p id="status-subtext" class="status-subtext">Let's check those dialogues!</p>
            </section>

            <section class="action-section">
                <button id="analyze-btn">Analyze now</button>
            </section>
            
            <div class="card">
                <ul id="stats-list" class="list">
                    <!-- Stats will be populated by JS -->
                </ul>
            </div>
            
            <h3 id="issue-header" class="section-header" style="display: none;">Issues found</h3>
            <div id="issue-card" class="card" style="display: none;">
                 <div id="issue-log" class="issue-log">
                     <!-- Issues will be populated by JS -->
                 </div>
                 <button id="show-all-issues-btn" style="display:none; width: 100%; margin-top: 1rem; padding: 0.75rem; background-color: var(--color-primary-muted); border: none; color: white; border-radius: var(--radius-btn); cursor: pointer;">Show All Issues</button>
            </div>
        </main>
    </div>

    <script type="module">
    import { customerTemplates } from '../data/customer_templates.js';

    // --- CONFIGURATION ---
    const MIN_LINES_PER_BLOCK = 3;
    const SCAN_DELAY_MS = 75;

    const ANALYSIS_CONFIG = {
        greeting: { parser: 'greeting' },
        lowCashRikk: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK },
        rikkDeclinesToBuy: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'sellsOnly' },
        rikkDeclinesToSell: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'buysOnly' },
        rikkBuysSuccess: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'sellsOnly' },
        rikkSellsSuccess: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'buysOnly' },
        itemNotGoodEnough: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'buysOnly' },
        rikkPriceTooHigh: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'buysOnly' },
        acknowledge_empty_stash: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK },
        customerHasNothingToSell: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'sellsOnly' },
        rikkHasNothingCustomerWants: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK, skipIf: 'buysOnly' },
        customerScaredOff: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK },
        generalBanter: { moods: ["default"], minLines: MIN_LINES_PER_BLOCK },
        negotiationSuccess: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, onlyIf: 'canNegotiate' },
        negotiationFail: { moods: ["paranoid", "happy", "default"], minLines: MIN_LINES_PER_BLOCK, onlyIf: 'canNegotiate' },
        offerCommunityHelp: { minLines: MIN_LINES_PER_BLOCK, onlyForArchetypes: ["PASTOR_JONES"] },
        rikkAgreesToHelpPastor: { minLines: MIN_LINES_PER_BLOCK, onlyForArchetypes: ["PASTOR_JONES"] },
        pastorThanksForHelp: { minLines: MIN_LINES_PER_BLOCK, onlyForArchetypes: ["PASTOR_JONES"] },
        pastorDeclinesHelp: { minLines: MIN_LINES_PER_BLOCK, onlyForArchetypes: ["PASTOR_JONES"] },
        rikkDeclinesPastor: { minLines: MIN_LINES_PER_BLOCK, onlyForArchetypes: ["PASTOR_JONES"] },
    };

    /**
     * Manages all UI interactions and DOM updates for the Dialogue Care interface.
     */
    class DialogueCareUI {
        constructor() {
            this.dom = {
                statusIcon: document.getElementById('status-icon'),
                statusText: document.getElementById('status-text'),
                statusSubtext: document.getElementById('status-subtext'),
                analyzeBtn: document.getElementById('analyze-btn'),
                statsList: document.getElementById('stats-list'),
                issueHeader: document.getElementById('issue-header'),
                issueCard: document.getElementById('issue-card'),
                issueLog: document.getElementById('issue-log'),
                showAllIssuesBtn: document.getElementById('show-all-issues-btn')
            };
            this.currentFilter = null; // To keep track of the active filter
            this.wittyLoadingInterval = null;
            this.wittyMessages = [
                "Brewing some digital coffee...",
                "Untangling dialogue spaghetti...",
                "Consulting the NPC oracle...",
                "Checking for rogue apostrophes...",
                "Polishing the prose...",
                "Making sure Rikk sounds like Rikk...",
                "Counting plot holes (hopefully zero!)...",
                "Dusting off the grammar rulebook...",
                "Ensuring NPCs aren't too predictable...",
                "Adding a dash of charm..."
            ];

            this.icons = {
                // Issue log icons
                warn: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-9.25-3.75a.75.75 0 0 0-1.5 0v4.5c0 .414.336.75.75.75h.008a.75.75 0 0 0 .75-.75v-4.5Zm.002 6.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" clip-rule="evenodd" /></svg>`,
                error: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8.28-2.22a.75.75 0 0 0-1.06 0L6.22 10.22a.75.75 0 0 0 1.06 1.06L10 8.84l2.72 2.72a.75.75 0 1 0 1.06-1.06L11.06 7.78Z" clip-rule="evenodd" /></svg>`,
                // Stat card icons
                coverage: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" /></svg>`,
                richness: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" /></svg>`,
                consistency: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`,
                // Main status icons
                defaultStatus: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9 9.75h.008v.008H9v-.008Zm6 0h.008v.008H15v-.008Z" /></svg>`,
                scanning: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>`, // Simple spinner
                excellentStatus: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068M15.75 21A9 9 0 1 1 3.372 10.068M21 12a9 9 0 0 0-9-9M3.75 12H3m18 0h-.75" /> </svg>`, // Check mark with sparkles
                warnStatus: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 12.036h.008v.008H12v-.008Z" /></svg>`, // Shield with exclamation
                errorStatus: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" /></svg>`, // Circle with X
            };
            this.reset();
        }

        reset() {
            this.dom.statusIcon.className = 'status-icon';
            this.dom.statusIcon.innerHTML = this.icons.defaultStatus;
            this.dom.statusText.textContent = 'Ready to Scan';
            this.dom.statusSubtext.textContent = 'Let\'s check those dialogues!';
            if (this.wittyLoadingInterval) {
                clearInterval(this.wittyLoadingInterval);
                this.wittyLoadingInterval = null;
            }
            this.dom.analyzeBtn.disabled = false;
            this.dom.analyzeBtn.textContent = 'Analyze now';
            this.dom.statsList.innerHTML = '';
            this.dom.issueCard.style.display = 'none';
            this.dom.issueHeader.style.display = 'none';
            this.dom.issueLog.innerHTML = '';
            this.dom.showAllIssuesBtn.style.display = 'none';
            this.currentFilter = null;
            this._updateActiveFilterUI();
            this._populateInitialStats();
        }

        _populateInitialStats() {
            const stats = [
                { id: 'coverage', label: 'Coverage', icon: this.icons.coverage, filterKey: 'coverage' },
                { id: 'richness', label: 'Richness', icon: this.icons.richness, filterKey: 'richness' },
                { id: 'consistency', label: 'Consistency', icon: this.icons.consistency, filterKey: 'consistency' },
            ];
            stats.forEach(stat => {
                const li = document.createElement('li');
                li.className = 'list-item stat-filterable'; // Make it known it's filterable
                li.id = `stat-${stat.id}`;
                li.dataset.filterKey = stat.filterKey; // For identifying what to filter by
                li.innerHTML = `
                    <div class="item-icon">${stat.icon}</div>
                    <div class="item-content">
                        <span class="item-label">${stat.label}</span>
                        <div class="value-container">
                            <span class="item-value">--</span>
                        </div>
                    </div>
                    <div class="item-progress">
                        <div class="progress-bar"><div class="progress-fill"></div></div>
                        <span class="progress-text">Not scanned</span>
                    </div>
                `;
                li.addEventListener('click', () => this.toggleFilter(stat.filterKey, li));
                this.dom.statsList.appendChild(li);
            });

            this.dom.showAllIssuesBtn.addEventListener('click', () => this.clearFilter());
        }

        toggleFilter(filterKey, statElement) {
            if (this.currentFilter === filterKey) {
                this.clearFilter();
            } else {
                this.currentFilter = filterKey;
                this._applyIssueFilter();
                this._updateActiveFilterUI(statElement);
                this.dom.showAllIssuesBtn.style.display = 'block';
            }
        }

        clearFilter() {
            this.currentFilter = null;
            this._applyIssueFilter();
            this._updateActiveFilterUI();
            this.dom.showAllIssuesBtn.style.display = 'none';
        }

        _updateActiveFilterUI(activeElement = null) {
            // Remove active class from all stat items
            this.dom.statsList.querySelectorAll('.list-item.stat-filterable').forEach(el => {
                el.classList.remove('stat-filter-active');
            });
            // Add to the currently active one
            if (activeElement && this.currentFilter) {
                activeElement.classList.add('stat-filter-active');
            }
        }

        _applyIssueFilter() {
            const issues = this.dom.issueLog.querySelectorAll('.issue-item');
            issues.forEach(issue => {
                if (!this.currentFilter || issue.dataset.issueType === this.currentFilter) {
                    issue.style.display = 'flex';
                } else {
                    issue.style.display = 'none';
                }
            });
        }
        
        updateStat(id, valueText, total, passed, unit) {
            const statEl = document.getElementById(`stat-${id}`);
            if (!statEl) return;
            statEl.querySelector('.item-value').textContent = valueText;
            const progress = total > 0 ? (passed / total) * 100 : 100;
            const fillEl = statEl.querySelector('.progress-fill');
            fillEl.style.width = `${progress}%`;
            fillEl.className = 'progress-fill'; // reset
            if(progress === 100) fillEl.classList.add('green');
            
            statEl.querySelector('.progress-text').textContent = `${passed} / ${total} ${unit}`;

            const valueEl = statEl.querySelector('.item-value');
            // Attempt to animate if valueText is purely numeric
            const numericValue = parseInt(valueText, 10);
            if (!isNaN(numericValue) && valueEl.textContent !== valueText) { // Only animate if it's a number and different
                 this._animateCounter(valueEl, numericValue, 300); // Animate over 300ms
            } else {
                valueEl.textContent = valueText; // Set directly if not animating
            }
        }

        _animateCounter(element, targetValue, duration) {
            let start = parseInt(element.textContent, 10) || 0;
            if (isNaN(start)) start = 0; // Handle cases where current text is not a number (e.g., "--" or "No")

            let startTime = null;

            function animation(currentTime) {
                if (startTime === null) startTime = currentTime;
                const timeElapsed = currentTime - startTime;
                const progress = Math.min(timeElapsed / duration, 1);
                const currentValue = Math.floor(progress * (targetValue - start) + start);
                element.textContent = currentValue;

                if (progress < 1) {
                    requestAnimationFrame(animation);
                } else {
                    element.textContent = targetValue; // Ensure final value is exact
                }
            }
            requestAnimationFrame(animation);
        }

        logIssue(level, message, issueType, tooltipText) {
            this.dom.issueCard.style.display = 'block';
            this.dom.issueHeader.style.display = 'block';
            const li = document.createElement('li');
            li.className = 'issue-item';
            li.dataset.issueType = issueType; // e.g., 'coverage', 'richness', 'consistency'
            if (tooltipText) {
                li.title = tooltipText;
            }
            li.innerHTML = `
                <div class="issue-icon ${level}">${this.icons[level]}</div>
                <div class="issue-message">${message}</div>
            `;
            this.dom.issueLog.appendChild(li);

            // If a filter is active, immediately apply it to the new issue
            if (this.currentFilter && issueType !== this.currentFilter) {
                li.style.display = 'none';
            }
        }

        setScanningState(isScanning) {
            this.dom.analyzeBtn.disabled = isScanning;
            this.dom.analyzeBtn.textContent = isScanning ? 'Analyzing...' : 'Analyze again';
            if (isScanning) {
                this.dom.statusIcon.className = 'status-icon scanning'; // Add scanning class for CSS animation
                this.dom.statusIcon.innerHTML = this.icons.scanning;
                this.dom.statusText.textContent = 'Scanning...';
                document.title = "Analyzing... | Dialogue Care";

                // Start witty loading messages
                if (this.wittyLoadingInterval) clearInterval(this.wittyLoadingInterval);
                let wittyIndex = 0;
                this.dom.statusSubtext.textContent = this.wittyMessages[wittyIndex]; // Show first one immediately
                this.wittyLoadingInterval = setInterval(() => {
                    wittyIndex = (wittyIndex + 1) % this.wittyMessages.length;
                    // This might be overridden by DialogueAnalyzer's per-archetype update, which is fine.
                    if(this.dom.analyzeBtn.disabled) { // Only update if still scanning
                       this.dom.statusSubtext.textContent = this.wittyMessages[wittyIndex];
                    }
                }, 2500); // Change message every 2.5 seconds

            } else { // Not scanning
                this.dom.statusIcon.classList.remove('scanning');
                if (this.wittyLoadingInterval) {
                    clearInterval(this.wittyLoadingInterval);
                    this.wittyLoadingInterval = null;
                }
                // Final document title will be set by setFinalStatus.
            }
        }
        
        setFinalStatus(state, analyzerStatusText, analyzerSubtext) { // analyzerStatusText is for logic (e.g. "Errors found"), analyzerSubtext has counts.
            if (this.wittyLoadingInterval) {
                clearInterval(this.wittyLoadingInterval);
                this.wittyLoadingInterval = null;
            }
            this.dom.statusIcon.classList.remove('scanning'); // Ensure scanning animation stops
            let iconSVG = this.icons.defaultStatus;
            let statusClass = 'status-icon'; // Base class
            let uiDisplayStatusText;
            let finalDocTitle;

            switch(state) {
                case 'excellent':
                    iconSVG = this.icons.excellentStatus;
                    statusClass = 'status-icon excellent';
                    uiDisplayStatusText = "Sparkling Clean!";
                    this.dom.statusSubtext.textContent = "All dialogues are looking fantastic!"; // Override analyzer subtext
                    finalDocTitle = "Sparkling Clean! | Dialogue Care";

                    // Add sparkle animation
                    this.dom.statusIcon.classList.add('excellent-animation');
                    setTimeout(() => {
                        this.dom.statusIcon.classList.remove('excellent-animation');
                    }, 800); // Duration of the animation

                    break;
                case 'warn':
                    iconSVG = this.icons.warnStatus;
                    statusClass = 'status-icon warn';
                    uiDisplayStatusText = "Needs a Polish!";
                    this.dom.statusSubtext.textContent = analyzerSubtext; // Use the subtext from analyzer (e.g. "X items can be improved")
                    finalDocTitle = `Warnings Found (${analyzerSubtext.split(' ')[0]}) | Dialogue Care`;
                    break;
                case 'error':
                    iconSVG = this.icons.errorStatus;
                    statusClass = 'status-icon error';
                    uiDisplayStatusText = "Uh Oh, Spaghetti-Os!";
                    this.dom.statusSubtext.textContent = analyzerSubtext; // Use the subtext from analyzer (e.g. "X critical issues")
                    finalDocTitle = `Errors Found (${analyzerSubtext.split(' ')[0]}) | Dialogue Care`;
                    break;
                default: // 'good' or any other state
                    iconSVG = this.icons.defaultStatus;
                    uiDisplayStatusText = "Looks Good";
                    this.dom.statusSubtext.textContent = "No major issues found during the scan.";
                    finalDocTitle = "Dialogues Healthy | Dialogue Care";
            }

            this.dom.statusIcon.className = statusClass;
            this.dom.statusIcon.innerHTML = iconSVG;
            this.dom.statusText.textContent = uiDisplayStatusText;
            document.title = finalDocTitle;
        }
    }

    class DialogueAnalyzer {
        constructor(templates, config, ui) {
            this.templates = templates;
            this.config = config;
            this.ui = ui;
            this.ui.dom.analyzeBtn.addEventListener('click', () => this.run());
        }

        async run() {
            this.ui.reset();
            this.ui.setScanningState(true);
            this.stats = {
                coverage: { total: 0, passed: 0 },
                richness: { total: 0, passed: 0, warnings: 0 },
                consistency: { total: 0, passed: 0, errors: 0 },
            };

            const archetypeKeys = Object.keys(this.templates);

            for (const key of archetypeKeys) {
                await new Promise(resolve => setTimeout(resolve, SCAN_DELAY_MS));
                this._analyzeArchetype(key);
                this.ui.dom.statusSubtext.textContent = `Scanning ${this.templates[key].baseName}...`;
            }

            this._finalizeAnalysis();
        }

        _finalizeAnalysis() {
            this.ui.setScanningState(false);
            const { coverage, richness, consistency } = this.stats;

            let finalState, statusText, statusSubtext; // statusText is now mostly for internal logic, UI class handles display text
            if (consistency.errors > 0 || coverage.passed < coverage.total) {
                finalState = 'error';
                statusText = 'Errors found'; // Internal logic text
                statusSubtext = `${consistency.errors + (coverage.total - coverage.passed)} critical issue(s) need attention.`;
            } else if (richness.warnings > 0) {
                finalState = 'warn';
                statusText = 'Warnings found'; // Internal logic text
                statusSubtext = `${richness.warnings} item(s) can be improved for better richness.`;
            } else {
                finalState = 'excellent';
                statusText = 'Excellent'; // Internal logic text
                statusSubtext = 'All dialogue contexts look great and are well-structured!';
            }
            // Pass the original statusText and subtext to setFinalStatus, which will then apply its own creative versions
            this.ui.setFinalStatus(finalState, statusText, statusSubtext);
        }

        _analyzeArchetype(key) {
            const archetype = this.templates[key];
            const dialogue = archetype.dialogue || {};
            const gameplayConfig = archetype.gameplayConfig || {};

            for (const contextKey in this.config) {
                 const contextConfig = this.config[contextKey];
                
                // Skip logic
                if (contextConfig.onlyForArchetypes && !contextConfig.onlyForArchetypes.includes(key)) continue;
                if (!contextConfig.onlyForArchetypes && key === "PASTOR_JONES") continue;
                if (contextConfig.skipIf === 'sellsOnly' && gameplayConfig.sellsOnly) continue;
                if (contextConfig.skipIf === 'buysOnly' && gameplayConfig.buysOnly) continue;
                if (contextConfig.onlyIf === 'canNegotiate' && gameplayConfig.negotiationResists) continue;

                const path = `<b>${key}</b>.${contextKey}`;
                
                this.stats.coverage.total++;
                if (!dialogue[contextKey]) {
                    this.stats.consistency.errors++; // This is a consistency error in terms of data presence.
                    const tooltip = `The entire dialogue context for '${contextKey}' is missing in '${key}'. Refer to ANALYSIS_CONFIG for expected structure.`;
                    this.ui.logIssue('error', `Missing context: ${path}`, 'coverage', tooltip); // Logged as 'coverage' type for filtering
                } else {
                    this.stats.coverage.passed++;
                    if (contextConfig.parser === 'greeting') {
                        this._analyzeGreeting(dialogue.greeting, path);
                    } else {
                        this._analyzeContext(dialogue[contextKey], contextConfig, path);
                    }
                }
            }
            this._updateUIStats();
        }
        
        _analyzeContext(blocks, config, path) {
            this.stats.consistency.total++;
            if (!Array.isArray(blocks)) {
                this.stats.consistency.errors++;
                const tooltip = `Data for ${path} should be an Array of dialogue blocks, but it's not. Check customer_templates.js.`;
                this.ui.logIssue('error', `Invalid data structure: ${path} is not an Array.`, 'consistency', tooltip);
                return;
            }
            this.stats.consistency.passed++;

            blocks.forEach(block => {
                this._analyzeBlock(block, config.minLines, path);
            });
        }

        _analyzeGreeting(obj, path) {
            if (typeof obj !== 'object' || obj === null) return;
            for (const key in obj) {
                const value = obj[key];
                const newPath = `${path}.${key}`;
                if (Array.isArray(value)) {
                    this._analyzeContext(value, { minLines: MIN_LINES_PER_BLOCK }, newPath);
                } else {
                    this._analyzeGreeting(value, newPath);
                }
            }
        }
        
        _analyzeBlock(block, minLines, path) {
            this.stats.richness.total++;
            if (!block || !Array.isArray(block.lines) || block.lines.length < minLines) {
                 this.stats.richness.warnings++;
                 const lineCount = (block && block.lines) ? block.lines.length : 0;
                 const tooltip = `This dialogue block in ${path} has ${lineCount} line(s), but the minimum recommended is ${minLines}. Consider adding more variations.`;
                 this.ui.logIssue('warn', `Low richness: ${path} has <b>${lineCount}/${minLines}</b> lines.`, 'richness', tooltip);
            } else {
                this.stats.richness.passed++;
            }
        }
        
        _updateUIStats() {
            this.ui.updateStat('coverage', `${this.stats.coverage.passed}`, this.stats.coverage.total, this.stats.coverage.passed, 'contexts');
            this.ui.updateStat('richness', `${this.stats.richness.warnings > 0 ? this.stats.richness.warnings : 'No'}`, this.stats.richness.total, this.stats.richness.passed, 'blocks');
            this.ui.updateStat('consistency', `${this.stats.consistency.errors > 0 ? this.stats.consistency.errors : 'No'}`, this.stats.consistency.total, this.stats.consistency.passed, 'checks');
        }
    }

    new DialogueAnalyzer(customerTemplates, ANALYSIS_CONFIG, new DialogueCareUI());
    </script>
