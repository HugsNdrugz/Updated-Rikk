<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rikk's Hustle - Refactored</title>
    <link rel="stylesheet" href="/styles/main.css">
    <!-- Other global styles like phone.css and hud.css will be linked here as they are created -->
    <link rel="stylesheet" href="/styles/phone.css"> <!-- Assuming this will be created soon -->
    <link rel="stylesheet" href="/styles/hud.css">   <!-- Assuming this will be created soon -->
    <!-- Favicon and other meta tags can be added here -->
</head>
<body>
    <!-- HUD Elements -->
    <div id="hud">
        <div id="hud-money">$0</div>
        <div id="hud-time">Day 1, 08:00</div>
        <div id="hud-heat">Heat: 0</div>
        <div id="hud-street-cred">Cred: 0</div>
        <!-- More HUD elements can be added here -->
    </div>

    <!-- Main Game Area -->
    <div id="game-container">
        <!-- Phone Structure -->
        <div id="phone">
            <div id="phone-screen">
                <!-- Phone apps will be loaded here by AppLoader -->
                <div id="phone-home-screen">
                    <!-- Icons for apps would go here, managed by AppLoader/UIManager -->
                    <p>Phone Home Screen</p>
                </div>
            </div>
            <div id="phone-bottom-bar">
                <!-- Navigation buttons for the phone (e.g., home, back) -->
                <button id="phone-home-button">Home</button>
            </div>
        </div>

        <!-- Other game world elements could go here, outside the phone -->
        <div id="world-notifications">
            <!-- General game notifications will appear here, managed by UIManager -->
        </div>
    </div>

    <!-- Modals and Popups Container -->
    <div id="modal-container">
        <!-- Modals (like settings, confirmations) will be rendered here -->
    </div>

    <script type="module" src="/src/core/main.js"></script>
</body>
</html>
