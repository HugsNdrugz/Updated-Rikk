<div id="contacts-app-container" class="app-screen-content">
    <div class="app-header">
        <h1>Contacts</h1>
        <button id="contacts-exit-button" class="app-exit-button">X</button>
    </div>
    <div id="contact-list-container">
        <!-- Contacts will be dynamically added here -->
    </div>
    <div id="contact-detail-view" class="hidden">
        <button id="back-to-contact-list" class="app-back-button">&lt; Back</button>
        <div id="contact-detail-content">
            <!-- Detailed contact info will be shown here -->
            <h2 id="detail-contact-name"></h2>
            <img id="detail-contact-avatar" src="#" alt="Contact Avatar" />
            <p id="detail-contact-description"></p>
            <p>Loyalty: <span id="detail-contact-loyalty"></span></p>
            <div id="detail-contact-services">
                <h3>Services:</h3>
                <ul id="detail-services-list"></ul>
            </div>
            <div id="detail-contact-missions">
                <h3>Missions:</h3>
                <ul id="detail-missions-list"></ul>
            </div>
        </div>
    </div>
</div>
