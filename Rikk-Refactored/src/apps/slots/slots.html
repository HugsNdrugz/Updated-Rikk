<div id="slots-app-container" class="app-screen-content">
    <h1>Lucky Slots!</h1>
    <div id="slots-display-area">
        <div class="slot-reel" id="reel1">[<span class="reel-symbol">?</span>]</div>
        <div class="slot-reel" id="reel2">[<span class="reel-symbol">?</span>]</div>
        <div class="slot-reel" id="reel3">[<span class="reel-symbol">?</span>]</div>
    </div>
    <div id="slots-message-area">
        <p>Welcome! Cost per spin: $10</p>
    </div>
    <div id="slots-controls">
        <button id="slot-spin-button">Spin!</button>
        <p>Your Money: <span id="slots-player-money">$0</span></p>
    </div>
    <button id="slots-exit-button">Exit Slots</button>
</div>
